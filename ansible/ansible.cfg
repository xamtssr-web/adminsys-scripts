# =============================================================================
# ansible.cfg — configuration locale du projet
# -----------------------------------------------------------------------------
# Ce fichier est lu automatiquement dès que la commande est lancée depuis ce
# dossier (Ansible remonte l'arborescence à partir du répertoire courant). Il
# fige le comportement pour tout le monde : un « --check --diff » lancé par un
# collègue se comporte comme le vôtre, ce qui n'est jamais vrai avec un
# ~/.ansible.cfg personnel.
#
# Ordre de priorité, du plus fort au plus faible :
#   variables d'environnement ANSIBLE_*  >  ./ansible.cfg  >  ~/.ansible.cfg
#   >  /etc/ansible/ansible.cfg
# =============================================================================

[defaults]

# --- Inventaire et rôles -----------------------------------------------------

# Inventaire par défaut : la commande la plus courte possible reste correcte
# (« ansible-playbook site.yml »). En production, remplacez ce chemin par votre
# inventaire réel, ou gardez l'habitude du « -i » explicite — on voit alors
# dans l'historique du shell sur quel parc la commande a été jouée, ce qui vaut
# de l'or trois semaines plus tard.
inventory = inventories/exemple/hosts.yml

# Les rôles voyagent avec le dépôt : ils ne dépendent d'aucun chemin système et
# se clonent avec le code qu'ils déploient.
roles_path = roles

# --- Sortie ----------------------------------------------------------------

# « default » est le seul affichage livré par ansible-core (les callbacks yaml et
# dense de l'époque d'Ansible 2.9 sont partis dans des collections, ou ont
# disparu). La lisibilité demandée est obtenue par les deux options ci-dessous,
# reconnues à partir d'ansible-core 2.19 : sur une version plus ancienne, elles
# sont simplement ignorées et la sortie reste celle par défaut, sans erreur.
stdout_callback = default

# Un résultat par tâche sur plusieurs lignes : un diff de fichier se lit, un
# dictionnaire Python sur une seule ligne ne se lit pas.
callback_result_format = yaml

# Formatage « joli » désactivé, volontairement. La documentation d'Ansible est
# explicite : en mode pretty, les réponses des modules sont réécrites « au
# détriment de l'exactitude » — un booléen, une valeur vide ou un type peuvent
# être transformés à l'affichage. C'est exactement ce qu'il ne faut pas quand on
# relit un --check pour décider de déployer.
callback_format_pretty = false

# --- Vérification des clés d'hôte SSH ---------------------------------------

# ⚠️ ASSUMÉ, et à comprendre avant de recopier ce fichier tel quel.
#
# Sans cette option, le tout premier contact avec une machine inconnue échoue
# (« Are you sure you want to continue connecting? » n'a personne pour répondre),
# et le déploiement s'arrête au milieu — souvent après avoir déjà modifié les
# premières machines.
#
# La contrepartie est réelle : accepter une clé d'hôte sans la vérifier, c'est
# s'exposer à une usurpation (interception) lors du tout premier échange.
#
# La parade propre, à utiliser sur tout inventaire réel :
#     ssh-keyscan -H serveur.exemple.fr >> ~/.ssh/known_hosts
# puis repasser cette valeur à True. Le False ici sert uniquement à rendre
# l'exemple lançable tel quel, sans étape préalable.
host_key_checking = False

# --- Performance ------------------------------------------------------------

# 10 machines en parallèle. Au-delà, on sature plus souvent la bande passante du
# contrôleur ou la charge des hyperviseurs qu'on ne gagne du temps, et les
# journaux entrelacés deviennent illisibles — c'est-à-dire inexploitables le
# jour où un hôte sur cent se comporte différemment.
forks = 10

# Délai de connexion SSH (secondes). 30 s laisse le temps à une machine lente
# (VM froide, pare-feu qui met du temps à répondre, DNS lent) sans immobiliser
# toute l'exécution pour un hôte injoignable.
timeout = 30

# Fichiers .retry : désactivés. Ils polluent le répertoire de travail et
# donnent l'illusion qu'un « --limit @site.retry » rejouera exactement ce qui a
# échoué, alors que l'inventaire a souvent changé entre-temps.
retry_files_enabled = False

# --- Recueil des faits ------------------------------------------------------

# « smart » : les faits ne sont recueillis que s'ils ne sont pas déjà en cache.
gathering = smart

# Cache disque d'une heure. Un rejeu ciblé (« --limit serveurs_bdd ») ne relance
# alors pas le recueil complet des faits, qui est la partie la plus lente d'un
# playbook sur du matériel modeste. Le dossier est ignoré par git.
fact_caching = jsonfile
fact_caching_connection = .cache/faits
fact_caching_timeout = 3600

# --- Connexion SSH ----------------------------------------------------------

[ssh_connection]

# Multiplexage : une seule connexion TCP est ouverte par hôte et réutilisée par
# les tâches suivantes. Sur un playbook de 40 tâches, c'est la différence entre
# 40 poignées de main SSH et une seule.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s

# Pipelining : les modules sont envoyés sur l'entrée standard de Python au lieu
# d'être déposés dans un fichier temporaire sur la cible. C'est plus rapide…
# mais cela suppose que sudo n'exige pas de terminal. Si vous voyez un
# « sudo: sorry, you must have a tty » ou un échec d'écriture de fichier
# temporaire sur des machines anciennes (requiretty dans sudoers), repassez
# cette valeur à False : le playbook fonctionnera à nouveau, un peu plus
# lentement.
pipelining = True
