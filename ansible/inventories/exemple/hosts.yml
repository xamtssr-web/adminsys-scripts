---
# =============================================================================
# Inventaire d'exemple — à recopier, jamais à utiliser tel quel en production
# -----------------------------------------------------------------------------
# Les adresses appartiennent à la plage de documentation RFC 5737
# (203.0.113.0/24) : elles ne sont routables nulle part, et « exemple.fr » est
# réservé à la documentation. Copier ce dossier vers inventories/mon-parc/,
# remplacer les adresses et les noms d'hôtes, puis lancer :
#
#   ansible-playbook -i inventories/mon-parc/hosts.yml site.yml --check --diff
#
# Structure : les groupes décident de QUI reçoit QUOI. Un hôte peut appartenir
# à plusieurs groupes ; ici « tous » sert de groupe racine pour que le playbook
# puisse cibler l'ensemble du parc sans dépendre du groupe implicite « all »
# (dont le nom est réservé par Ansible et ne peut pas être surchargé).
# =============================================================================

all:
  children:
    tous:
      vars:
        # Compte de connexion utilisé par Ansible. Il doit exister sur les
        # machines cibles et disposer des droits sudo — c'est l'œuf et la
        # poule du premier déploiement : on l'amorce à la main (ou via la
        # console), le rôle « utilisateurs » gère tous les suivants.
        ansible_user: exploit

        # Interpréteur Python des cibles. Debian 12+ et RHEL 9+ fournissent
        # /usr/bin/python3 ; le préciser évite l'avertissement de découverte
        # automatique et garantit un comportement identique d'un hôte à
        # l'autre. À retirer si le parc est hétérogène (Ansible le découvre
        # alors tout seul).
        ansible_python_interpreter: /usr/bin/python3

      children:
        serveurs_web:
          hosts:
            web-01.exemple.fr:
              ansible_host: 203.0.113.10
            web-02.exemple.fr:
              ansible_host: 203.0.113.11

        serveurs_bdd:
          hosts:
            bdd-01.exemple.fr:
              ansible_host: 203.0.113.20

# Remarque : 203.0.113.10/11 sont les deux seules adresses attendues par la
# documentation du dépôt ; toute adresse réelle, tout nom d'organisation ou
# tout domaine personnel y sont proscrits.
